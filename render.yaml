services:
  - type: web
    name: saudi-stock-analyzer
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install --no-build-isolation setuptools==68.2.2 wheel==0.41.2
      python -m pip install --no-build-isolation -r requirements_render.txt
    startCommand: streamlit run render_saudi_analyzer.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PIP_NO_BUILD_ISOLATION
        value: "true"
      - key: SETUPTOOLS_USE_DISTUTILS
        value: "stdlib"